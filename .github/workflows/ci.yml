name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - run: npm ci
      - run: bash scripts/check-versions.sh
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npm run build:cli
      - run: npm run build:mcp
      - run: npm run build:plugin
      - run: git diff --exit-code plugin/dist
      - run: bash scripts/mcp-smoke.sh plugin/dist/mcp.mjs
      - run: npm run build:mcpb
      - run: bash scripts/mcp-smoke.sh mcpb/server/index.mjs
      - run: npm run build:dsh && npm run test:dsh
