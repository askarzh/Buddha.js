# Test overlay for tests/e2e/headless.test.ts's real-composition headless
# boot proof: mounts the buddha-js plugin (dsh/src/index.ts) and the mock
# LLM adapter fixture (mock-llm-plugin.ts) over the stock headless profile,
# routes the default model at the mock provider, and disables the real
# DeepSeek adapter so nothing in this run can reach the network or need an
# API key.
#
# __BUDDHA_PLUGIN__, __MOCK_PLUGIN__, and __STATE_DIR__ are substituted with
# absolute paths at test time (see tests/e2e/headless.test.ts) before this
# template is written to a temp file and passed via `dsh --patch`.

- insert:
    - id: buddha
      name: __BUDDHA_PLUGIN__
      config:
        stateDir: __STATE_DIR__

    - id: mock-llm
      name: __MOCK_PLUGIN__

- id: agent-default-model
  config:
    provider: mock
    model: mock

- id: llm-deepseek
  disabled: true
